[repo]
name = "architecture-insuretech"
base_branch = "main"
work_branch = "solution"

[app]
name = "scaletestapp"
image = "ghcr.io/yandex-practicum/scaletestapp"
tag = "latest"
port = 8080
namespace = "default"

[memory_hpa]
request = "30Mi"
limit = "30Mi"
target_utilization = 80
min_replicas = 1
max_replicas = 10

[rps_hpa]
target_rps_per_pod = 40
rate_window = "1m"
metric_name = "http_requests_per_second"
min_replicas = 1
max_replicas = 10

[monitoring]
namespace = "monitoring"
metric = "http_requests_total"
scrape_interval = "15s"
prometheus_release = "kube-prometheus-stack"
prometheus_chart_version = "93.3.0"
adapter_release = "prometheus-adapter"
adapter_chart_version = "5.4.1"
adapter_relist_interval = "30s"

[locust]
users = 750
spawn_rate = 50
run_time = "3m"

[capture]
baseline = "30s"
after_load = "7m"
sample_interval = "30s"

[nginx]
upstream = "backend_servers"
zone = "partner_limit"
zone_size = "10m"
key = "$binary_remote_addr"
rate = "10r/m"
burst = 0
status = 429
listen = 80
location = "/"
servers = ["backend1.example.com", "backend2.example.com", "backend3.example.com"]
check_fast_requests = 12
check_series_seconds = 60
check_series_interval_seconds = 1

[requirements]
rto_minutes = 45
rpo_minutes = 15
availability_percent = 99.9
osago_max_wait_seconds = 60
osago_peak_concurrent_users = 2500

[broker]
name = "Apache Kafka"
brokers = 3
replication_factor = 3
min_insync_replicas = 2
topic_products = "products-tariffs"
topic_policies = "policies-issued"
topic_osago_applications = "osago-applications"
topic_osago_offers = "osago-offers"

[osago]
storage = "Redis"
state_ttl_minutes = 10
sse_heartbeat_seconds = 15
insurers_now = 5
insurers_planned = 10
insurer_call_timeout_seconds = 5
retry_max_attempts = 3
retry_base_delay_ms = 500
poll_first_seconds = 2
poll_max_interval_seconds = 5
cb_window_calls = 20
cb_failure_rate_percent = 50
cb_open_seconds = 30
web_rate_limit_per_minute = 5
