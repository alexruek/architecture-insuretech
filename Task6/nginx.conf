http {
    # Зона учета запросов для Rate Limiting.
    # Ключ - адрес клиента, 10 МБ памяти хватает примерно на 160 тысяч адресов.
    # rate=10r/m: не более 10 запросов в минуту, следующий запрос принимается
    # не раньше чем через 6 секунд после предыдущего. Запросы сверх лимита
    # не ставятся в очередь, а сразу отклоняются.
    # По договоренности партнер может отправлять до 20 RPS, лимит задан по заданию 6.
    # Если перед nginx стоит балансировщик, все запросы приходят с его адреса.
    # Тогда в ключ нужно подставить адрес клиента из X-Forwarded-For (модуль realip)
    # или идентификатор партнера, например API-ключ из заголовка.
    limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

    # Код ответа при превышении лимита (по умолчанию nginx возвращает 503).
    limit_req_status 429;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            limit_req zone=partner_limit;
            proxy_pass http://backend_servers;
        }
    }
}
