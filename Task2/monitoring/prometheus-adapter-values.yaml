# Значения чарта prometheus-adapter: публикует RPS на под в custom.metrics.k8s.io для HPA.
prometheus:
  # Сервис Prometheus из релиза kube-prometheus-stack в namespace monitoring.
  url: http://kube-prometheus-stack-prometheus.monitoring.svc
  port: 9090
  path: ""
metricsRelistInterval: 30s
rules:
  default: false
  custom:
    # http_requests_total - счетчик, RPS получается через rate за окно 1m.
    - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)_total$"
        as: "${1}_per_second"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
