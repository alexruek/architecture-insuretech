apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # Имя совпадает с HPA из hpa-memory.yaml: применение этого файла заменяет масштабирование по памяти.
  name: scaletestapp
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletestapp
  minReplicas: 1
  maxReplicas: 10
  metrics:
    # Метрику RPS на под отдает prometheus-adapter через custom.metrics.k8s.io.
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "40"
