apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  namespace: default
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            # HPA считает утилизацию памяти от requests, поэтому requests равен limits.
            requests:
              memory: 30Mi
            limits:
              memory: 30Mi
          # Проба идет на /metrics: запросы к / увеличивают http_requests_total и искажали бы RPS.
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 5
